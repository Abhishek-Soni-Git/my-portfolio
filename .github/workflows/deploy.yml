name: Deploy Portfolio to Azure

on:
  push:
    branches:
      - master

jobs:
  # Job 1 — Staging Deploy
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Setup Node
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          registry-url: 'https://pkgs.dev.azure.com/abhisheksoni0554/portfolio_li/_packaging/npm_packages/npm/registry/'

      # Azure Artifacts Authentication
      - name: Authenticate to Azure Artifacts
        run: |
          echo "registry=https://pkgs.dev.azure.com/abhisheksoni0554/portfolio_li/_packaging/npm_packages/npm/registry/" > ~/.npmrc
          echo "always-auth=true" >> ~/.npmrc
          echo "//pkgs.dev.azure.com/abhisheksoni0554/portfolio_li/_packaging/npm_packages/npm/registry/:username=anything" >> ~/.npmrc
          echo "//pkgs.dev.azure.com/abhisheksoni0554/portfolio_li/_packaging/npm_packages/npm/registry/:_password=$(echo -n ${{ secrets.AZURE_ARTIFACTS_TOKEN }} | base64)" >> ~/.npmrc
          echo "//pkgs.dev.azure.com/abhisheksoni0554/portfolio_li/_packaging/npm_packages/npm/registry/:email=anything@example.com" >> ~/.npmrc

      # Install dependencies
      - name: Install Dependencies
        run: npm install

      # Publish package
      - name: Publish shared-utils
        run: |
          cd shared-utils
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.AZURE_ARTIFACTS_TOKEN }}

      # Login to ACR
      - name: Login to ACR
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Build and Push Docker Image
      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/portfolio:latest
          build-args: |
            VITE_APP_NAME=${{ vars.VITE_APP_NAME }}
            VITE_APP_ENV=${{ vars.VITE_APP_ENV }}

      # Deploy to staging slot
      - name: Deploy to Staging Slot
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          slot-name: abhi
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          images: ${{ secrets.ACR_LOGIN_SERVER }}/portfolio:latest

  # Job 2 — Production Deploy
  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production

    steps:
      - name: Deploy to Production
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          images: ${{ secrets.ACR_LOGIN_SERVER }}/portfolio:latest